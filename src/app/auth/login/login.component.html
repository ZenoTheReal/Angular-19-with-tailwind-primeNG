<form [formGroup]="loginform">
  <p-card header="Simple Card" class="block max-w-lg w-full m-auto p-4 sm:p-6">
    <div class="flex flex-col gap-y-5">
      <div class="flex flex-col">
        <label for="username">Email</label>
        <input formControlName="email" pInputText id="username" aria-describedby="email-help" variant="outlined" />
      </div>
      <div class="flex flex-col">
        <label for="password">Password</label>
        <p-password [toggleMask]="true" [fluid]="true" inputId="password" [feedback]="false" varient="outlined" />
      </div>
      <div class="card flex justify-center">
        <p-button label="Check" (click)="onSubmit()" [disabled]="!loginform.valid" />
      </div>
    </div>
  </p-card>
</form>
